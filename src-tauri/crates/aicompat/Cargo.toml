[package]
name = "aicompat"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic OAuth and API client compatibility layer for AI assistant features (OpenAI/Codex, Anthropic/Claude, custom OpenAI-compatible endpoints)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "socks", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
# The system's proxy settings (macOS, Windows), for "follow the system":
# already in the tree through reqwest, so no new crates.
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
# Image generation (images/): the download resolver and nothing else -
# already in the tree through reqwest, so no new crates.
tokio = { version = "1", features = ["net", "time"] }
# The main crate's generated TypeScript bindings (its src/bindings.rs)
# carry AgentTurn and the types it holds. The main crate turns this on from
# its dev-dependencies only, so shipped builds never compile specta.
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

# Reading the proxy the Windows settings carry ourselves (see
# http.rs::system_proxy_from_registry): already in the tree through
# hyper-util, so no new crates.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
