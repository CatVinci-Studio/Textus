[package]
name = "aicompat"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic OAuth and API client compatibility layer for AI assistant features (OpenAI/Codex, Anthropic/Claude, custom OpenAI-compatible endpoints)"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
# Image generation (images/): the download resolver and nothing else -
# already in the tree through reqwest, so no new crates.
tokio = { version = "1", features = ["net", "time"] }
# The main crate's generated TypeScript bindings (its src/bindings.rs)
# carry AgentTurn and the types it holds. The main crate turns this on from
# its dev-dependencies only, so shipped builds never compile specta.
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
