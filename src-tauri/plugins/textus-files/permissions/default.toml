"$schema" = "schemas/schema.json"

[default]
description = "Everything Textus's iOS and Android document access needs."
permissions = [
  "allow-pick-document",
  "allow-pick-folder",
  "allow-create-document",
  "allow-read-text",
  "allow-read-data",
  "allow-write-text",
  "allow-list-folder",
  "allow-remembered",
  "allow-begin-access",
  "allow-share",
  "allow-haptic",
]
