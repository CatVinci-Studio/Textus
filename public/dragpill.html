<!doctype html>
<!-- The floating tab pill shown while a tab is dragged BETWEEN windows (see
     lib.rs show_drag_pill): a webview element can't be rendered outside its
     own window, so the in-flight tab is its own tiny transparent
     click-through window instead. Self-contained on purpose - it's created
     and destroyed per drag, reads its title/dirty state from its URL query,
     and never touches the Tauri API. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: grabbing;
      }
      /* The look the window that started the drag draws a lifted tab
         with (?look=, drag-pill-look.ts): a capsule on its surface. */
      .pill {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        margin: 2px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--pill-edge, rgba(0, 0, 0, 0.15));
        background: var(--pill-bg, #f5f4f0);
        color: var(--pill-fg, #333);
        font-family: var(
          --pill-font,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif
        );
        font-size: var(--pill-size, 13px);
        box-shadow: var(--pill-shadow, 0 4px 14px rgba(0, 0, 0, 0.25));
      }
      .title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="pill">
      <span class="dot" id="dot" style="display: none"></span>
      <span class="title" id="title"></span>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      document.documentElement.style.cssText = params.get("look") || "";
      document.getElementById("title").textContent = params.get("title") || "";
      if (params.get("dirty") === "1")
        document.getElementById("dot").style.display = "";
    </script>
  </body>
</html>
