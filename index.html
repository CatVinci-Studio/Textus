<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Textus</title>
    <!-- Painted before any script or stylesheet loads, so a new window opens
         in the system's colours instead of flashing white (App.css's --bg).
         An appearance pinned in Settings wins: Rust's boot script
         (src-tauri/src/boot.js) has set data-theme before this is parsed.
         On Linux the window itself is built in the pinned colour too, for
         the frames before this paints: pinned_background in
         src-tauri/src/settings.rs, whose test checks it against these two
         colours and App.css's --bg. -->
    <style>
      html {
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1b1e24;
        }
      }
      html[data-theme="light"] {
        background: #ffffff;
      }
      html[data-theme="dark"] {
        background: #1b1e24;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
