name: Android release

# Builds the signed Android APK (arm64) for a release and attaches it to the
# draft as Textus_<version>_android_arm64.apk. release.yml calls this before
# publishing, so a failed build keeps the release a draft. The project in
# src-tauri/gen/android is not committed: it is generated here and finished
# by scripts/android-prepare.sh, as on a developer's machine.
#
# Needs ANDROID_KEYSTORE (the .jks, base64), ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in the release
# environment. The APK must be signed by the certificate below, or Android
# refuses it as an update.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.4.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NDK_VERSION: 27.2.12479018
      SIGNER_SHA256: 559b0eb511a274a75704f9ae12390da2a75f774b91714eeb50c4769148ce4f0a
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android
          save-if: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Write the signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set: the APK can't be signed."
              exit 1
            fi
          done
          dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$dir"
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$dir/textus.jks"
          printf 'keystore=textus.jks\nalias=%s\nstorePassword=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEY_ALIAS" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" \
            > "$dir/keystore.properties"
          echo "TEXTUS_ANDROID_KEYSTORE=$dir/keystore.properties" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          npx tauri android init --ci
          sh scripts/android-prepare.sh
          npx tauri android build --ci --apk --target aarch64

      - name: Check the signature and attach the APK
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          signer=$("$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" \
            verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$signer" != "$SIGNER_SHA256" ]; then
            echo "::error::The APK is signed by $signer, not Textus's key: phones would refuse it as an update."
            exit 1
          fi
          out="$RUNNER_TEMP/Textus_${RELEASE_TAG#v}_android_arm64.apk"
          cp "$apk" "$out"
          gh release upload "$RELEASE_TAG" "$out" --clobber

      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-signing"
