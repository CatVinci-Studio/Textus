name: Mirror downloads

# The website's download buttons serve the installers from our own R2
# bucket (textus.catvinci.com/download/), not from GitHub, which is slow or
# unreachable from some networks. Copies a published release there and
# points the bucket's manifest.json at it (scripts/mirror-downloads.sh).
# release.yml calls this after publishing the newest stable tag; run it by
# hand to retry one.
#
# Needs CLOUDFLARE_API_TOKEN (an API token with R2 edit on the account);
# without it this only warns.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for example v1.0.4)
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror-downloads:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 49abb4d436c552f6e4497b1782fc9beb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the installers to textus.catvinci.com/download
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set: the website still downloads the previous version. Run scripts/mirror-downloads.sh $RELEASE_TAG by hand."
            exit 0
          fi
          scripts/mirror-downloads.sh "$RELEASE_TAG"
