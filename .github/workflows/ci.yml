name: CI

on:
  pull_request:
  # dev is the integration branch: each round's work lands there in one
  # push, so CI runs on it directly instead of on one PR per change.
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The minifier only warns on a broken selector list - and a warning
      # dropped a whole design-system rule once, unnoticed for three releases.
      - name: Build, failing on CSS syntax warnings
        run: |
          npm run build 2>&1 | tee build.log
          ! grep -q 'css-syntax-error' build.log
      # The Playwright flows, without comparing screenshots: the baselines
      # were taken with one machine's fonts and would differ here. This is
      # every spec in e2e/, the desktop's and the phone layout's
      # (e2e/phone*.spec.ts, in a phone-sized touch viewport) alike, so a
      # change to a component with a phone form is checked in both.
      - run: npx playwright install --with-deps chromium
      - name: Playwright flows, desktop and phone
        run: npm run test:visual -- --ignore-snapshots

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        # macos-26: what macos-latest points at today, pinned (as in the
        # release workflows) so an image switch is a deliberate change.
        os: [macos-26, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        working-directory: .
        run: npm ci
      - name: Prepare official Agent runtime
        run: node scripts/prepare-harness.mjs

      - name: Validate frontend on this platform
        working-directory: .
        run: npm run check
      - name: Build frontend assets for the native app
        working-directory: .
        run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # iOS: proves the shared code and the #[cfg(desktop)] gating compile for
  # the iOS simulator (docs/ios/code-map.zh.md). No secrets and no signing: the
  # Xcode project is generated fresh (gen/apple is not committed) and the
  # simulator build is unsigned (--no-sign). Deliberately NOT a dependency of
  # the required "rust" check below while the iOS port is young.
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The same Xcode the TestFlight upload uses (ios-release.yml has why
      # it is picked this way).
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
            | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n1)
          if [ -z "$xcode" ]; then
            echo "::error::no released Xcode 26 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ios
      - name: Install XcodeGen (used by tauri ios init)
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: npm ci
      - run: npm run build
      - name: Generate the Xcode project (src-tauri/gen/apple)
        run: npx tauri ios init --ci && sh scripts/ios-prepare.sh
      - name: Build for the iOS simulator, unsigned
        run: npx tauri ios build --ci --debug --target aarch64-sim --no-sign

  # Preserve the required "rust" check used by branch protection. It passes
  # only when every platform passes, including when one job fails or skips.
  rust:
    needs: rust-platforms
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require all native checks
        env:
          NATIVE_RESULT: ${{ needs.rust-platforms.result }}
        run: test "$NATIVE_RESULT" = success
