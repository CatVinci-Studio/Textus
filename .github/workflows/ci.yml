name: CI

# Three layers (docs/dev/testing.md has the table):
#
#   pull request   check (types, lint, unit tests, format, build); plus the
#                  Rust checks on Linux when src-tauri/ changed
#                  (scripts/ci-changes.mjs). Required: check, native,
#                  ci-config. A contributor runs `npm run check` locally.
#   push to main   the same.
#   before release the full suite on every platform: native on Linux, macOS
#                  and Windows, e2e (2 shards) and e2e-webkit, the iOS
#                  simulator. release.yml calls this on the tagged commit;
#                  it also runs on a pull request into stable and by hand.
#
# `check`'s save round trip (src/document-view/save-roundtrip*.test.ts)
# runs only when the change can reach saving: the editor, src/document*/,
# the Markdown helpers, the npm dependencies or CI. Markdown under src/,
# e2e/ or src-tauri/ (help guides, the AI skills) is code, not
# documentation.
#
# Caches: Rust builds and the Playwright browser are saved from main only.
# Pull requests restore main's and write none, so they don't evict main's
# from the repository's 10 GB.

on:
  pull_request:
  push:
    branches: [main, stable]
  # By hand, or from the release workflow before it builds a tag: the full
  # suite, whatever changed.
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

# A pull request's newer push replaces its older run. A push to main or a
# release branch never does: each commit there gets its own run, because the
# release workflow waits for CI on the exact tagged commit - grouped by
# branch, a pending run was replaced by the next merge and v1.0.5-rc.3 waited
# for a CI result that never came.
concurrency:
  group: ci-${{ inputs.full && 'full-' || '' }}${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change is light, reaches the Rust build (`native`) or
  # saving (`roundtrip`): scripts/ci-changes.mjs.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      light: ${{ steps.diff.outputs.light }}
      native: ${{ steps.diff.outputs.native }}
      roundtrip: ${{ steps.diff.outputs.roundtrip }}
      # The full suite: before a tag (the release workflow calls this one),
      # on a pull request into stable, or by hand. Otherwise the quick one:
      # check, and Rust on Linux where Rust changed.
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          FULL: ${{ inputs.full || github.event_name == 'workflow_dispatch' || github.base_ref == 'stable' }}
        run: |
          if [ "$FULL" = true ]; then
            printf 'light=false\nnative=true\nroundtrip=true\nfull=true\n' >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci-changes.mjs --base "$PR_BASE" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-changes.mjs --base "$PUSH_BASE" --push >> "$GITHUB_OUTPUT"
          fi

  # A fork's pull request that changes CI or the test configuration fails
  # here, for a maintainer to read that part first: the base's copy of
  # scripts/guard-ci-config.mjs, run against the pull request's head, so
  # the guard itself can't be changed to pass. A required check - taken out
  # of the workflow, it never reports and the pull request can't merge.
  # Skipped (and so passed) for branches of this repository.
  ci-config:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "pull/$NUMBER/head:refs/remotes/pr/head"
          node scripts/guard-ci-config.mjs --base "$BASE" --head refs/remotes/pr/head

  check:
    needs: changes
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # GitHub's settings, the license or root Markdown alone: their format
      # and the READMEs' structure, nothing that builds or tests.
      - if: needs.changes.outputs.light == 'true'
        run: npm run format:check && node scripts/check-readmes.mjs
      # The save round trip only where the change can reach saving.
      - if: needs.changes.outputs.light != 'true'
        run: npm run check
        env:
          TEXTUS_SKIP_ROUNDTRIP: ${{ needs.changes.outputs.roundtrip != 'true' && '1' || '' }}
      # The minifier only warns on a broken selector list - and a warning
      # dropped a whole design-system rule once, unnoticed for three releases.
      # Both builds are `vite build` without the `tsc` that `npm run build`
      # puts in front of it: `npm run check` has just type-checked the same
      # project. `set -o pipefail` because the step's shell otherwise takes
      # the exit status of `tee`: a build that failed - over the startup
      # budget, say (vite.startup-budget.ts) - passed here.
      - name: Build, failing on CSS syntax warnings
        if: needs.changes.outputs.light != 'true'
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log
          ! grep -q 'css-syntax-error' build.log
      # The browser playground (src/playground/) shares the editor: a change
      # that breaks its build shows up here, before it is deployed.
      - name: Build the playground
        if: needs.changes.outputs.light != 'true'
        run: |
          set -o pipefail
          npx vite build --config vite.playground.config.ts 2>&1 | tee build-playground.log
          ! grep -q 'css-syntax-error' build-playground.log

  # The flows split by test across two machines, each running two workers
  # (playwright.config.ts): a few minutes each.
  e2e-shard:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: e2e (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The official plugins, which no longer ship with the app: the dev
      # server serves them from this checkout (vite.dev-plugins.ts), and
      # the plugin flows install them from it.
      # Pinned: a plugin release moving to a new API broke the flows once.
      # Bump it on purpose, with the app change that needs it.
      - uses: actions/checkout@v7
        with:
          repository: CatVinci-Studio/textus-plugins
          ref: 9e3728a2c8b93afbc56060fda5726f0aae1b766e
          path: textus-plugins
      - run: npm ci --prefix textus-plugins
      # Chromium comes from the cache when this Playwright version's is there;
      # its system libraries are installed either way.
      - id: playwright
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Saved from main only, and by one shard (the others would race it for the key).
      - if: steps.browser.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.cache-primary-key }}
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      # A failed flow's error context (the page as it was) and any
      # screenshots and traces it left.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One required check for the two shards, like `native` below: passes only
  # when all of them passed (or were skipped together, when the run isn't the
  # full suite).
  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          test "$CHANGES" = success
          test "$RESULT" = success || test "$RESULT" = skipped

  # The flows macOS, iOS and Linux users meet in WebKit
  # (playwright.config.ts's WEBKIT_SPECS). Not required: it runs after a
  # merge to main or stable, not on every pull request.
  e2e-webkit:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # Not required: its failure shows here without failing the run (or
    # the release that calls it).
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v7
        with:
          repository: CatVinci-Studio/textus-plugins
          ref: 9e3728a2c8b93afbc56060fda5726f0aae1b766e
          path: textus-plugins
      - run: npm ci --prefix textus-plugins
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit --ignore-snapshots --pass-with-no-tests
        env:
          E2E_WEBKIT: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-webkit-test-results
          path: test-results/
          retention-days: 7

  # Linux alone in the quick suite, where the change reaches Rust; macOS
  # and Windows (with their unit tests: path and line-ending code) in the
  # full one, which the release waits for on the tagged commit.
  native-platform:
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.full == 'true'
    name: native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # The Rust checks on each platform, and the unit tests on each one
        # too: path handling, line endings and the like differ between them.
        # Not again on Linux, where `check` runs them on the same image. On
        # Windows, the slowest machine for both, in a job of their own beside
        # the Rust one. macOS keeps them in one job: its runners are the
        # scarce ones, and the ios job already takes a second.
        #
        # macos-26: what macos-latest points at today, pinned (as in the
        # release workflows) so an image switch is a deliberate change.
        #
        # Linux alone, or all of them in the full suite (see above).
        include: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[{"name":"ubuntu-22.04","os":"ubuntu-22.04","rust":true},{"name":"macos-26","os":"macos-26","rust":true,"unit":true},{"name":"windows-2025","os":"windows-2025","rust":true},{"name":"windows-2025, unit tests","os":"windows-2025","unit":true}]' || '[{"name":"ubuntu-22.04","os":"ubuntu-22.04","rust":true}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Debug info is most of what the dev and test profiles write and link
      # (on Windows a .pdb per binary), and CI never opens a debugger; a
      # failing test still names its file and line.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        if: matrix.unit || needs.changes.outputs.native == 'true'
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && needs.changes.outputs.native == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        if: matrix.unit || needs.changes.outputs.native == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: matrix.unit || needs.changes.outputs.native == 'true'
      # The rest of `check` doesn't differ between platforms, nor does the
      # save round trip, which `check` runs once.
      - if: matrix.unit
        run: npm test
        env:
          TEXTUS_SKIP_ROUNDTRIP: "1"
      # Installs the toolchain src-tauri/rust-toolchain.toml names.
      - if: matrix.rust && needs.changes.outputs.native == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: matrix.rust && needs.changes.outputs.native == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: matrix.rust && needs.changes.outputs.native == 'true'
        run: npm run check:native

  # One required check for the three platforms: passes only when all of
  # them passed (or were skipped together, when the change can't reach the
  # Rust build).
  native:
    needs: [changes, native-platform]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every platform
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.native-platform.result }}
        run: |
          test "$CHANGES" = success
          test "$RESULT" = success || test "$RESULT" = skipped

  # iOS: proves the shared code and the #[cfg(desktop)] gating compile for
  # the iOS simulator (docs/dev/ios-code-map.md). No secrets and no signing: the
  # Xcode project is generated fresh (gen/apple is not committed) and the
  # simulator build is unsigned (--no-sign). Not a required check while the
  # iOS port is young.
  ios:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    # Not required: its failure shows here without failing the run (or
    # the release that calls it).
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # As in native-platform: no debug info for a build nothing debugs.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      # The same Xcode the TestFlight upload uses (ios-release.yml has why
      # it is picked this way).
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
            | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n1)
          if [ -z "$xcode" ]; then
            echo "::error::no released Xcode 26 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install XcodeGen (used by tauri ios init)
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: npm ci
      - run: npm run build
      - name: Generate the Xcode project (src-tauri/gen/apple)
        run: npx tauri ios init --ci && sh scripts/ios-prepare.sh
      - name: Build for the iOS simulator, unsigned
        run: npx tauri ios build --ci --debug --target aarch64-sim --no-sign
      # Built is not started: a command whose state only the desktop
      # manages aborts the app once its page calls it.
      - name: Start it in the simulator
        run: scripts/smoke-ios-sim.sh src-tauri/gen/apple/build/arm64-sim/Textus.app --screenshot ios-sim.png
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-sim
          path: |
            ios-sim.png
            ~/Library/Logs/DiagnosticReports/Textus*.ips
          if-no-files-found: ignore
