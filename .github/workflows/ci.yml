name: CI

# Every job runs the same npm command a contributor runs locally
# (CONTRIBUTING.md), so a green local run means a green CI run:
#
#   check    npm run check         types, lint, unit tests, formatting,
#                                  README/version/updater checks; and the build
#   e2e      npm run test:e2e      the Playwright flows, desktop and phone -
#                                  split by spec file across three machines
#   native   npm run check:native  rustfmt, clippy, Rust tests - on Linux,
#                                  macOS and Windows
#   ios      the iOS simulator build
#
# A pull request that only touches documentation runs `check` alone; the
# other jobs are skipped, which branch protection counts as passed. One that
# only touches the Rust backend skips `e2e` too: the flows run the frontend
# against a mocked backend, so Rust can't change their result.

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

# A pull request's newer push replaces its older run. A push to main or a
# release branch never does: each commit there gets its own run, because the
# release workflow waits for CI on the exact tagged commit - grouped by
# branch, a pending run was replaced by the next merge and v1.0.5-rc.3 waited
# for a CI result that never came.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything besides documentation changed (`code`), and whether any
  # of it reaches the browser (`frontend`). Pushes to main always run
  # everything.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Documentation: Markdown anywhere, docs/, the issue templates and
          # the license. Anything else is code.
          code=$(git diff --name-only "$BASE" HEAD \
            | grep -vE '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^LICENSE$)' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Code outside src-tauri/ is frontend, and so are the src-tauri
          # files the browser does see: the icons the frontend imports,
          # boot.js (which e2e/storage.spec.ts runs) and the Tauri configs.
          if printf '%s\n' "$code" | grep -v '^src-tauri/' | grep -q . ||
            printf '%s\n' "$code" \
              | grep -qE '^src-tauri/(icons/|src/boot\.js$|tauri(\.[a-z]+)?\.conf\.json$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # The minifier only warns on a broken selector list - and a warning
      # dropped a whole design-system rule once, unnoticed for three releases.
      - name: Build, failing on CSS syntax warnings
        run: |
          npm run build 2>&1 | tee build.log
          ! grep -q 'css-syntax-error' build.log
      # The browser playground (src/playground/) shares the editor: a change
      # that breaks its build shows up here, before it is deployed.
      - name: Build the playground
        run: |
          npm run build:playground 2>&1 | tee build-playground.log
          ! grep -q 'css-syntax-error' build-playground.log

  # On one machine the flows took eight to nine minutes; --shard splits them
  # by spec file across three.
  e2e-shard:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: e2e (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

  # One required check for the three shards, like `native` below: passes only
  # when all of them passed (or were skipped together, for a documentation or
  # Rust-only change).
  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          test "$CHANGES" = success
          test "$RESULT" = success || test "$RESULT" = skipped

  native-platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26: what macos-latest points at today, pinned (as in the
        # release workflows) so an image switch is a deliberate change.
        os: [ubuntu-22.04, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The unit tests once per platform too: path handling, line endings
      # and the like differ between them. The rest of `check` does not.
      - run: npm test
      # Installs the toolchain src-tauri/rust-toolchain.toml names.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm run check:native

  # One required check for the three platforms: passes only when all of
  # them passed (or were skipped together, for a documentation change).
  native:
    needs: native-platform
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every platform
        env:
          RESULT: ${{ needs.native-platform.result }}
        run: test "$RESULT" = success || test "$RESULT" = skipped

  # iOS: proves the shared code and the #[cfg(desktop)] gating compile for
  # the iOS simulator (docs/dev/ios-code-map.md). No secrets and no signing: the
  # Xcode project is generated fresh (gen/apple is not committed) and the
  # simulator build is unsigned (--no-sign). Not a required check while the
  # iOS port is young.
  ios:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The same Xcode the TestFlight upload uses (ios-release.yml has why
      # it is picked this way).
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
            | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n1)
          if [ -z "$xcode" ]; then
            echo "::error::no released Xcode 26 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ios
      - name: Install XcodeGen (used by tauri ios init)
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: npm ci
      - run: npm run build
      - name: Generate the Xcode project (src-tauri/gen/apple)
        run: npx tauri ios init --ci && sh scripts/ios-prepare.sh
      - name: Build for the iOS simulator, unsigned
        run: npx tauri ios build --ci --debug --target aarch64-sim --no-sign
