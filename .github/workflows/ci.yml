name: CI

# Every job runs the same npm command a contributor runs locally
# (CONTRIBUTING.md), so a green local run means a green CI run:
#
#   check    npm run check         types, lint, unit tests, formatting,
#                                  README/version/updater checks; and the build
#   e2e      npm run test:e2e      the Playwright flows, desktop and phone -
#                                  split by spec file across three machines
#   native   npm run check:native  rustfmt, clippy, Rust tests - on Linux,
#                                  macOS and Windows
#   ios      the iOS simulator build
#
# `check` always runs. Its save round trip (src/document-view/
# save-roundtrip*.test.ts, platform-independent) runs there alone, not in
# the native jobs, and on a pull request only when the change can reach
# saving: the editor, src/document*/, the Markdown helpers, the documents
# it reads, the npm dependencies or CI. A pull request runs the other jobs
# only where its change can reach them (scripts/ci-changes.mjs decides;
# skipped jobs count as passed for branch protection):
#
#   documentation, or a version bump      check alone
#   the frontend only                     check, e2e
#   the Rust backend only                 check, native, ios
#   both; a workflow, .nvmrc, or the npm
#   dependencies                          everything
#
# The e2e flows run the frontend against a mocked backend, so Rust can't
# change their result; native and ios embed only a few frontend files, which
# the script finds. Markdown under src/, e2e/ or src-tauri/ (help guides,
# the AI skills) is code, not documentation. A version bump changes only the
# version lines of the five
# files scripts/check-versions.mjs keeps in step. A push to main or a release
# branch runs everything, except a version bump's.
#
# Caches: Rust builds and the Playwright browser are saved from main only.
# Pull requests restore main's and write none, so they don't evict main's
# from the repository's 10 GB.

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

# A pull request's newer push replaces its older run. A push to main or a
# release branch never does: each commit there gets its own run, because the
# release workflow waits for CI on the exact tagged commit - grouped by
# branch, a pending run was replaced by the next merge and v1.0.5-rc.3 waited
# for a CI result that never came.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the change can reach the browser (`e2e`) and the Rust build
  # (`native`, also ios): scripts/ci-changes.mjs.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
      native: ${{ steps.diff.outputs.native }}
      roundtrip: ${{ steps.diff.outputs.roundtrip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/ci-changes.mjs --base "$PR_BASE" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-changes.mjs --base "$PUSH_BASE" --push >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The save round trip only where the change can reach saving.
      - run: npm run check
        env:
          TEXTUS_SKIP_ROUNDTRIP: ${{ needs.changes.outputs.roundtrip != 'true' && '1' || '' }}
      # The minifier only warns on a broken selector list - and a warning
      # dropped a whole design-system rule once, unnoticed for three releases.
      - name: Build, failing on CSS syntax warnings
        run: |
          npm run build 2>&1 | tee build.log
          ! grep -q 'css-syntax-error' build.log
      # The browser playground (src/playground/) shares the editor: a change
      # that breaks its build shows up here, before it is deployed.
      - name: Build the playground
        run: |
          npm run build:playground 2>&1 | tee build-playground.log
          ! grep -q 'css-syntax-error' build-playground.log

  # On one machine the flows took eight to nine minutes; --shard splits them
  # by spec file across three.
  e2e-shard:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    name: e2e (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium comes from the cache when this Playwright version's is there;
      # its system libraries are installed either way.
      - id: playwright
        run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Saved from main only, and by one shard (three would race for the key).
      - if: steps.browser.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser.outputs.cache-primary-key }}
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      # A failed flow's error context (the page as it was) and any
      # screenshots and traces it left.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One required check for the three shards, like `native` below: passes only
  # when all of them passed (or were skipped together, when the change can't
  # reach the browser).
  e2e:
    needs: [changes, e2e-shard]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every shard
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.e2e-shard.result }}
        run: |
          test "$CHANGES" = success
          test "$RESULT" = success || test "$RESULT" = skipped

  native-platform:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-26: what macos-latest points at today, pinned (as in the
        # release workflows) so an image switch is a deliberate change.
        os: [ubuntu-22.04, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The unit tests once per platform too: path handling, line endings
      # and the like differ between them. The rest of `check` does not, nor
      # does the save round trip, which `check` runs once.
      - run: npm test
        env:
          TEXTUS_SKIP_ROUNDTRIP: "1"
      # Installs the toolchain src-tauri/rust-toolchain.toml names.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run check:native

  # One required check for the three platforms: passes only when all of
  # them passed (or were skipped together, when the change can't reach the
  # Rust build).
  native:
    needs: native-platform
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every platform
        env:
          RESULT: ${{ needs.native-platform.result }}
        run: test "$RESULT" = success || test "$RESULT" = skipped

  # iOS: proves the shared code and the #[cfg(desktop)] gating compile for
  # the iOS simulator (docs/dev/ios-code-map.md). No secrets and no signing: the
  # Xcode project is generated fresh (gen/apple is not committed) and the
  # simulator build is unsigned (--no-sign). Not a required check while the
  # iOS port is young.
  ios:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The same Xcode the TestFlight upload uses (ios-release.yml has why
      # it is picked this way).
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
            | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n1)
          if [ -z "$xcode" ]; then
            echo "::error::no released Xcode 26 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install XcodeGen (used by tauri ios init)
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: npm ci
      - run: npm run build
      - name: Generate the Xcode project (src-tauri/gen/apple)
        run: npx tauri ios init --ci && sh scripts/ios-prepare.sh
      - name: Build for the iOS simulator, unsigned
        run: npx tauri ios build --ci --debug --target aarch64-sim --no-sign
