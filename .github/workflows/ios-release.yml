name: iOS release

# Builds the signed iOS app and uploads it to App Store Connect (TestFlight).
# Submitting a build for review stays a manual step in App Store Connect.
#
# Trigger: push a tag like ios-v0.9.2 (it must name the version in
# package.json and the other version files - scripts/check-versions.mjs),
# or run it by hand.
#
# Secrets (App Store Connect > Users and Access > Integrations > Keys,
# role "Admin" - cloud-managed signing refuses a lesser role such as App
# Manager):
#   APPLE_API_ISSUER   Issuer ID
#   APPLE_API_KEY_ID   Key ID
#   APPLE_API_KEY_P8   contents of the AuthKey_<KEY_ID>.p8 file
#   APPLE_TEAM_ID      (already used by the macOS release)
# With the key, Xcode manages iOS signing itself: no certificate or
# provisioning profile has to be exported into the repository.

on:
  push:
    tags:
      - "ios-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

# Two uploads of the same ref at once would only race for build numbers.
concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    # macos-26 is what macos-latest points at today (same arm64 pool);
    # pinned, with the Xcode chosen below, so the SDK the upload is built
    # with only changes on purpose.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Tag matches the app version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"
          else
            node scripts/check-versions.mjs
          fi

      # App Store Connect takes uploads built with the current SDK only.
      # The newest Xcode 26 on the image, chosen explicitly rather than
      # trusting the image's default to be it - and only a released one:
      # uploads built with a beta Xcode are refused, and the image installs
      # betas as e.g. Xcode_26_beta.app, with plain-version symlinks
      # (Xcode_26.0.app) pointing at them. So real folders only (find
      # skips symlinks), named by a version number alone.
      - name: Select Xcode
        run: |
          xcode=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
            | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -n1)
          if [ -z "$xcode" ]; then
            echo "::error::no released Xcode 26 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install XcodeGen
        run: brew install xcodegen
      - run: npm ci

      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        # ios-prepare.sh adds the privacy manifest; without it the upload
        # is refused.
        run: npx tauri ios init --ci && sh scripts/ios-prepare.sh

      # Every upload needs a build number App Store Connect hasn't seen.
      # run_number grows with each run but stays the same when a failed
      # run is re-run, so the attempt is folded in: run 15 attempt 2 is
      # build 152. (Builds before this scheme were numbered run_number
      # alone - all far below run_number * 10.)
      - name: Build the signed app
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          build_number=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          echo "Build number $build_number"
          npx tauri ios build --ci \
            --export-method app-store-connect \
            --build-number "$build_number"

      - name: Upload to App Store Connect
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          ipa=$(find src-tauri/gen/apple/build -name '*.ipa' | head -n1)
          test -n "$ipa"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
