name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (for example v0.8.11)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # The one place the product's name is spelled for this workflow: the
  # release title and the DMG the Homebrew cask points at.
  PRODUCT_NAME: Textus

permissions:
  contents: write

# One run per tag at a time: a rebuild started while the tag's first run is
# still uploading would race it for the same draft's assets.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Cheap checks on a Linux runner before any macOS/Windows minutes are
  # spent: the tag must name the version the app's files carry, and a
  # stable tag needs its release notes.
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Validate version tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'

      # The checks come from the commit this workflow runs at (so a rebuild
      # of a tag older than scripts/check-versions.mjs still gets them);
      # what they check is the tag.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: tagged

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches the app version
        run: node scripts/check-versions.mjs --root tagged --tag "$RELEASE_TAG"

      # The tagged app reads textus-latest.json and its workflow keeps
      # tauri-action from uploading latest.json - the manifest every Levis
      # install reads (scripts/updater-manifest.mjs). This also refuses a
      # rebuild of an old Levis tag from this workflow.
      - name: Updater never serves Levis's manifest
        run: node scripts/updater-manifest.mjs check --root tagged

      # Required for a newly pushed stable tag. A rebuild of a tag from
      # before release notes were kept (0.8.10 and older) only warns.
      - name: Release notes exist for a stable tag
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ -s "tagged/$notes" ]; then exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::$notes is missing at $RELEASE_TAG - write the release notes before tagging."
            exit 1
          fi
          echo "::warning::$notes is missing at $RELEASE_TAG; the release keeps its current notes."

      # The tests ran in CI on the tagged commit (it reached main or a
      # release/ branch through a pull request); the builds below don't run
      # them again. Waits while that CI is still going, and stops the release
      # if any of the required jobs failed. A rebuild of an old tag
      # (workflow_dispatch) predates these job names and skips the gate.
      - name: CI passed on the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git -C tagged rev-parse HEAD)
          echo "Tagged commit: $sha"
          for attempt in $(seq 1 90); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "check" or .name == "e2e" or .name == "native")]')
            failed=$(jq -r '[.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped")) | .name] | join(", ")' <<< "$runs")
            if [ -n "$failed" ]; then
              echo "::error::CI failed on $sha: $failed. Fix it on main and tag again."
              exit 1
            fi
            passed=$(jq '[.[] | select(.status == "completed")] | map(.name) | unique | length' <<< "$runs")
            if [ "$passed" -eq 3 ]; then
              echo "check, e2e and native passed on $sha."
              exit 0
            fi
            echo "Waiting for CI on $sha ($passed of 3 done)..."
            sleep 30
          done
          echo "::error::CI on $sha did not finish within 45 minutes (or never ran: was this commit pushed to main or a release/ branch?)."
          exit 1

  build:
    needs: preflight
    name: build (${{ matrix.target || matrix.platform }})
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 is what macos-latest points at today (same arm64
          # pool); pinned so the next image switch is a deliberate change.
          - platform: macos-26
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Intel Macs: cross-compiled on the same Apple silicon runner (the
          # Intel runner pool is being retired). Its DMG and updater tarball
          # are named _x64, beside the _aarch64 ones.
          - platform: macos-26
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          # Windows ships the NSIS .exe and nothing else; the target list
          # itself lives in src-tauri/tauri.windows.conf.json, so a local
          # `tauri build` produces the same one artifact this does.
          #
          # It used to bundle MSI as well on stable tags, and that is what
          # made Windows upgrades ask to uninstall first: the two installers
          # register in different places, so neither recognises the other's
          # copy - take the .msi once and the next .exe cannot replace it.
          # MSI also cannot build a pre-release at all ("optional pre-release
          # identifier in app version must be numeric-only ... for msi
          # target"), so rc tags were NSIS-only regardless, and the updater
          # has always shipped NSIS. One installer, one upgrade path.
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # Older tags predate .gitattributes. Match the source blobs on Windows
      # too, so a rebuild does not fail Prettier after an automatic CRLF checkout.
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # The two macOS builds share a runner image; one cache each.
          key: ${{ matrix.target || 'host' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        # Pinned to the commit of v0.6.2 (what @v0 resolved to): a moving
        # major tag could change how the release is built between two tags.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (the .sig files) so installed apps
          # can verify downloads against the pubkey baked into
          # tauri.conf.json. It is Levis's key, reused: that is why Textus
          # must never publish a latest.json (see includeUpdaterJson below).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (Gatekeeper). tauri-action
          # imports the base64 .p12 into a temp keychain; the bundler then
          # signs the .app with hardened runtime, notarizes the DMG with
          # notarytool, and staples the ticket. All six secrets must be set
          # together - a partially-configured set fails the macOS build
          # rather than shipping an unsigned DMG.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "${{ env.PRODUCT_NAME }} ${{ env.RELEASE_TAG }}"
          # Keep partial matrix builds away from the updater. The publish
          # job exposes the release only after every build succeeds.
          releaseDraft: true
          # A semver pre-release suffix (v0.9.0-rc.1, -beta.2, -alpha) marks
          # the GitHub release as a pre-release. That is what keeps it away
          # from everyone else: the updater endpoint in tauri.conf.json points
          # at `releases/latest/...`, and GitHub's "latest" excludes
          # pre-releases - so a stable install never even sees this build's
          # manifest. Without this the tag pattern below (v*.*.*) matches
          # an rc tag too and would ship it to every user as the new stable.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          # Never upload latest.json: Levis 0.9.x installs read that name
          # from this repository (the old CatVinci-Studio/Levis URL
          # redirects here) and trust the same signing key, so they would
          # install Textus over themselves. The publish job writes
          # textus-latest.json from the uploaded .sig files instead.
          # scripts/updater-manifest.mjs check fails if this line goes.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # textus-bin (packaging/arch/PKGBUILD) installs this tarball. Its
      # binary is a second build with TEXTUS_DISTRIBUTION=aur: it reports new
      # versions but does not install them, because pacman owns /usr/bin.
      # --no-bundle recompiles only the textus crate and skips the installers.
      - name: Build and upload AUR tarball
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEXTUS_DISTRIBUTION: aur
        run: |
          npx tauri build --no-bundle
          scripts/package-linux-tarball.sh "${RELEASE_TAG#v}" \
            src-tauri/target/release/textus dist-aur
          gh release upload "$RELEASE_TAG" dist-aur/* --clobber

  # Builds and tests textus-bin and attaches it to the draft (see
  # arch-package.yml). Before publish, so a broken package keeps the whole
  # release a draft.
  arch-package:
    needs: build
    uses: ./.github/workflows/arch-package.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  publish:
    needs: [build, arch-package]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      newest-stable: ${{ steps.newest.outputs.newest-stable }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The updater reads textus-latest.json from the newest release the
      # moment it is published. It is written here, once every platform's
      # signed artifacts are on the draft, from their .sig files: each
      # artifact's URL is the release's download URL plus its asset name.
      # A platform whose build silently failed to upload (a race, an upload
      # error) has no .sig, and the build step fails rather than leave every
      # user of that platform without the update.
      - name: Write the updater manifest (textus-latest.json)
        run: |
          sigs="$RUNNER_TEMP/sigs"
          mkdir -p "$sigs"
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir "$sigs" --clobber
          notes="docs/releases/${RELEASE_TAG#v}.md"
          node scripts/updater-manifest.mjs build \
            --version "${RELEASE_TAG#v}" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
            --sig-dir "$sigs" \
            $([ -f "$notes" ] && printf -- '--notes-file %s' "$notes") \
            --out "$RUNNER_TEMP/textus-latest.json"
          jq '{version, platforms: (.platforms | keys)}' "$RUNNER_TEMP/textus-latest.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/textus-latest.json" --clobber

      # Levis installs read latest.json from the newest release (the old
      # repository URL redirects here). Once this release is "Latest", the
      # copy of the last Levis release's own manifest keeps them updating to
      # that Levis - which points its user to Textus. It names only Levis
      # assets on that tag, so nothing here can install Textus over Levis.
      # The last Levis release must be out first; this step fails until it is.
      - name: Carry the last Levis release's manifest (latest.json)
        run: |
          last=$(node -e "import('./scripts/updater-manifest.mjs').then(m => console.log(m.LEVIS_LAST_TAG))")
          mkdir -p "$RUNNER_TEMP/levis"
          gh release download "$last" --pattern latest.json --dir "$RUNNER_TEMP/levis" --clobber
          node scripts/updater-manifest.mjs bridge --levis-manifest "$RUNNER_TEMP/levis/latest.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/levis/latest.json" --clobber

      # The last gate before anything is public: the release's latest.json
      # (whatever is there now) must be the last Levis release's. Anything
      # else would be installed by every Levis install (same signing key).
      - name: latest.json is the last Levis release's
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            > "$RUNNER_TEMP/assets.txt"
          check=()
          if grep -qx latest.json "$RUNNER_TEMP/assets.txt"; then
            mkdir -p "$RUNNER_TEMP/now"
            gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/now" --clobber
            check=(--levis-manifest "$RUNNER_TEMP/now/latest.json")
          fi
          node scripts/updater-manifest.mjs guard --assets-file "$RUNNER_TEMP/assets.txt" "${check[@]}"

      # A workflow_dispatch rebuild of an old tag republishes that release,
      # but making it "Latest" or pointing the cask or arch-repo at it
      # would downgrade everyone. Asked here, after the builds, not when
      # the run started: a hotfix tag pushed while this one was still
      # building is newer by the time this one is published.
      - name: Is this the newest stable tag?
        id: newest
        run: |
          newest=$(git ls-remote --tags --refs origin 'v*.*.*' \
            | sed 's|.*refs/tags/||' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)
          echo "Newest stable tag: ${newest:-none}"
          if [ "$newest" = "$RELEASE_TAG" ]; then
            echo "newest-stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest-stable=false" >> "$GITHUB_OUTPUT"
          fi

      # A rebuilt older tag must not become GitHub's "Latest" release: the
      # updater and the website's download links follow releases/latest.
      - name: Publish completed release
        env:
          NEWEST_STABLE: ${{ steps.newest.outputs.newest-stable }}
        run: |
          NOTES="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
          fi
          if [ "$NEWEST_STABLE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

  # After publishing, only for the newest stable tag: the download mirror,
  # the Homebrew cask and the [catvinci] pacman repository. Pre-releases have
  # no channel of their own in any of them, so pointing them at an rc would
  # hand it to everyone; an older tag would downgrade. Each is its own
  # workflow and can be re-run by hand for one tag.
  mirror-downloads:
    needs: publish
    if: ${{ needs.publish.outputs.newest-stable == 'true' }}
    uses: ./.github/workflows/mirror-downloads.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  update-homebrew-tap:
    needs: publish
    if: ${{ needs.publish.outputs.newest-stable == 'true' }}
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  # pacman also sorts 0.9.0_rc.1 above 0.9.0 (see update-arch-repo.yml).
  update-arch-repo:
    needs: publish
    if: ${{ needs.publish.outputs.newest-stable == 'true' }}
    uses: ./.github/workflows/update-arch-repo.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
