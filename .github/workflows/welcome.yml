# One welcome on a person's first issue or pull request here.
name: welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for your first issue in Textus! We usually reply within a week. If it's a feature idea, have a look at the [roadmap](https://github.com/CatVinci-Studio/Textus/blob/main/ROADMAP.md#not-in-the-core-plugins): it may make a great plugin.

            感谢你第一次参与 Textus！我们一般一周内回复。如果是新功能想法，可以先看[路线图](https://github.com/CatVinci-Studio/Textus/blob/main/ROADMAP.zh.md)里“不进核心”的部分，也许更适合做成插件。
          pr-message: |
            Thanks for your first pull request to Textus! We reply within 3 days. While you wait, please make sure `npm run check` passes and the description says what you tested.

            感谢你给 Textus 的第一个 PR！我们 3 天内回复。请确认 `npm run check` 通过，并在描述里写明测了什么。
