name: Android dry run

# Builds the signed Android APK (arm64) for a release and attaches it to the
# draft as Textus_<version>_android_arm64.apk. release.yml calls this before
# publishing, so a failed build keeps the release a draft. The project in
# src-tauri/gen/android is not committed: it is generated here and finished
# by scripts/android-prepare.sh, as on a developer's machine.
#
# Needs ANDROID_KEYSTORE (the .jks, base64), ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD in the release
# environment. The APK must be signed by the certificate below, or Android
# refuses it as an update.

on:
  push:
    branches: [android-release]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_TAG: v0.0.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NDK_VERSION: 27.2.12479018
      SIGNER_SHA256: 559b0eb511a274a75704f9ae12390da2a75f774b91714eeb50c4769148ce4f0a
    steps:
      - uses: actions/checkout@v7
        with:

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: android
          save-if: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Throwaway signing key
        run: |
          dir="$RUNNER_TEMP/android-signing"; mkdir -p "$dir"
          keytool -genkeypair -keystore "$dir/textus.jks" -alias t -keyalg RSA -keysize 2048 -validity 1 -storepass dryrun -keypass dryrun -dname CN=dry
          printf 'keystore=textus.jks\nalias=t\nstorePassword=dryrun\nkeyPassword=dryrun\n' > "$dir/keystore.properties"
          echo "TEXTUS_ANDROID_KEYSTORE=$dir/keystore.properties" >> "$GITHUB_ENV"

      - name: Build the APK
        run: |
          npx tauri android init --ci
          sh scripts/android-prepare.sh
          npx tauri android build --ci --apk --target aarch64

      - name: Show the APK
        run: ls -la src-tauri/gen/android/app/build/outputs/apk/universal/release/
