name: Update Homebrew tap

# Points the Homebrew cask (CatVinci-Studio/homebrew-tap) at a published
# release's two DMGs, so `brew install --cask catvinci-studio/tap/textus`
# serves that version on Apple silicon and Intel alike. release.yml calls
# this after publishing the newest stable tag; run it by hand to retry one.
#
# Needs TAP_DEPLOY_KEY: the private half of a deploy key with write access
# to CatVinci-Studio/homebrew-tap (GITHUB_TOKEN can't push to another
# repository).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for example v1.0.4)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  PRODUCT_NAME: Textus

jobs:
  update-homebrew-tap:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # packaging/homebrew/textus.rb is the cask's shape at that tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: app

      - name: Update cask version and sha256
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          # Loudly: a quietly skipped tap update leaves brew users on the
          # old version with nobody noticing.
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::TAP_DEPLOY_KEY is not set - the Homebrew cask was not updated"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          # The release may have been published seconds ago; let the CDN catch up.
          sha_of() {
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$1.dmg" \
              "https://github.com/CatVinci-Studio/Textus/releases/download/${RELEASE_TAG}/${PRODUCT_NAME}_${VERSION}_$1.dmg"
            sha256sum "$1.dmg" | cut -d' ' -f1
          }
          SHA_ARM=$(sha_of aarch64)
          SHA_INTEL=$(sha_of x64)
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key"
          git clone git@github.com:CatVinci-Studio/homebrew-tap.git
          cd homebrew-tap
          # The cask's shape comes from packaging/homebrew/textus.rb each
          # time (per-architecture since the Intel DMG in 1.0.3); only the
          # version and the two checksums are this release's.
          cp ../app/packaging/homebrew/textus.rb Casks/textus.rb
          sed -i "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/textus.rb
          sed -i "s|^  sha256 arm: .*|  sha256 arm:   \"${SHA_ARM}\",|" Casks/textus.rb
          sed -i "s|^         intel: .*|         intel: \"${SHA_INTEL}\"|" Casks/textus.rb
          grep -q "${SHA_ARM}" Casks/textus.rb && grep -q "${SHA_INTEL}" Casks/textus.rb
          # A rerun after a successful push has nothing to commit.
          if git diff HEAD --quiet; then
            echo "The cask already serves ${VERSION}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -am "textus ${VERSION}"
          git push
