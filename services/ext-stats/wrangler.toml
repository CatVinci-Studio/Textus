# Deploy from this folder: CLOUDFLARE_ACCOUNT_ID=... npx wrangler@4 deploy
name = "textus-ext-stats"
main = "worker.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "textus.catvinci.com/api/ext/*", zone_name = "catvinci.com" }]

[[d1_databases]]
binding = "DB"
database_name = "textus-ext-stats"
# PLACEHOLDER: the id `wrangler d1 create textus-ext-stats` prints (README.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
