# Deploy from this folder: CLOUDFLARE_ACCOUNT_ID=... npx wrangler@4 deploy
name = "textus-feedback"
main = "worker.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "textus.catvinci.com/api/feedback", zone_name = "catvinci.com" }]

[vars]
REPO = "CatVinci-Studio/Textus"
MAIL_FROM = "feedback@catvinci.com"
MAIL_TO = "studio@catvinci.com"

[[kv_namespaces]]
binding = "LIMITS"
id = "ea148873c2d4450b845500685a0cfdd4"

[[send_email]]
name = "MAIL"
destination_address = "studio@catvinci.com"

# Secrets (wrangler secret put): APP_ID, and APP_KEY - the GitHub App's
# private key as PKCS#8 PEM.
